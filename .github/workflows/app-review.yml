name: OpenReview app review

on:
  repository_dispatch:
    types: [openreview_review]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout OpenReview
        uses: actions/checkout@v4

      - name: Create scoped installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OPENREVIEW_APP_ID }}
          private-key: ${{ secrets.OPENREVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.event.client_payload.repository_owner }}
          repositories: ${{ github.event.client_payload.repository_name }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Review pull request
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.event.client_payload.repository }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          BASE_SHA: ${{ github.event.client_payload.base_sha }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          REVIEW_FORCE: ${{ github.event.client_payload.force }}
          REVIEW_PROVIDER: ${{ vars.REVIEW_PROVIDER || 'openai-compatible' }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_BASE_URL: ${{ vars.REVIEW_BASE_URL }}
          REVIEW_PROVIDER_API_KEY: ${{ secrets.REVIEW_PROVIDER_API_KEY }}
        run: node src/index.js
