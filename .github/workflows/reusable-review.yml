name: OpenReview reusable workflow

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout pull request repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout OpenReview engine
        uses: actions/checkout@v4
        with:
          repository: danieldamilola/Openreview
          ref: main
          path: openreview

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run review engine
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_PROVIDER: ${{ vars.REVIEW_PROVIDER || 'openai-compatible' }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_BASE_URL: ${{ vars.REVIEW_BASE_URL }}
          REVIEW_PROVIDER_API_KEY: ${{ secrets.REVIEW_PROVIDER_API_KEY }}
          REVIEW_RULES_DIR: openreview/rules
          REVIEW_INLINE: ${{ vars.REVIEW_INLINE || 'true' }}
        run: node openreview/src/index.js

  review-command:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout pull request repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout OpenReview engine
        uses: actions/checkout@v4
        with:
          repository: danieldamilola/Openreview
          ref: main
          path: openreview

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run review engine
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          BASE_SHA: ''
          HEAD_SHA: ''
          REVIEW_FORCE: 'true'
          REVIEW_PROVIDER: ${{ vars.REVIEW_PROVIDER || 'openai-compatible' }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_BASE_URL: ${{ vars.REVIEW_BASE_URL }}
          REVIEW_PROVIDER_API_KEY: ${{ secrets.REVIEW_PROVIDER_API_KEY }}
          REVIEW_RULES_DIR: openreview/rules
          REVIEW_INLINE: ${{ vars.REVIEW_INLINE || 'true' }}
        run: node openreview/src/index.js
